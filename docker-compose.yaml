services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - media_data:/app/media
    networks:
      - coolify
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "80"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}.rule=Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}.entrypoints=https"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}.tls=true"
      - "traefik.http.services.${COOLIFY_RESOURCE_UUID}.loadbalancer.server.port=80"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}-http.rule=Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}-http.entrypoints=http"
      - "traefik.http.routers.${COOLIFY_RESOURCE_UUID}-http.middlewares=${COOLIFY_RESOURCE_UUID}-redirect-https"
      - "traefik.http.middlewares.${COOLIFY_RESOURCE_UUID}-redirect-https.redirectscheme.scheme=https"

networks:
  coolify:
    external: true

volumes:
  media_data:
